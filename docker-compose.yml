services:
  # The whole app: Bun API + static UI + Python pipeline → http://localhost:8080
  backend:
    # Pulled from GitHub's registry (built by .github/workflows/ci.yml).
    # `docker compose build backend` / `up --build` builds it from source instead.
    # This is the CPU image. With an NVIDIA GPU, docker-compose.override.yml
    # (written by the installers; see README) switches to the -cuda image and
    # reserves the GPU.
    image: ghcr.io/raufimusaddiq/sorot:${SOROT_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    env_file:
      - path: .env.docker
      # LLM_API_KEY (and any other secret) lives here; gitignored, optional.
      - path: .env.llm
        required: false
    # Lets LLM_BASE_URL reach an Ollama running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional hot-reload UI on :3000 (scripts\start.ps1 -Dev).
  frontend:
    image: sorot-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - dev

  frontend-test:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: test
    profiles:
      - test

  frontend-lint:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: base
    command: bun run lint
    profiles:
      - lint

volumes:
  hf-cache:
