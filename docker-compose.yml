services:
  # The whole app: Bun API + static UI + Python pipeline → http://localhost:8080
  backend:
    image: sorot-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    env_file:
      - path: .env.docker
      # LLM_API_KEY (and any other secret) lives here; gitignored, optional.
      - path: .env.llm
        required: false
    # Lets LLM_BASE_URL reach an Ollama running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional hot-reload UI on :3000 (scripts\start.ps1 -Dev).
  frontend:
    image: sorot-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - dev

  frontend-test:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: test
    profiles:
      - test

  frontend-lint:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: base
    command: bun run lint
    profiles:
      - lint

volumes:
  hf-cache:
