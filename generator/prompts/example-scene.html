<!doctype html>
<html lang="id">
  <body>
    <div data-composition-id="shot-02" data-width="1080" data-height="1920">
      <!-- text zone (168-560 px) and picture zone (600-1330 px) never overlap -->
      <div class="text-zone">
        <h1 class="title">Air hujan ditampung</h1>
        <p class="body">Sedikit demi sedikit, tangki <span class="accent">penuh</span></p>
      </div>
      <div class="picture-zone">
        <div class="diorama"></div>
      </div>
      <style>
        [data-composition-id="shot-02"] { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #EAF2F4; font-family: "Plus Jakarta Sans", sans-serif; }
        [data-composition-id="shot-02"] .text-zone { position: absolute; left: 96px; right: 96px; top: 200px; height: 360px; display: flex; flex-direction: column; justify-content: center; gap: 28px; text-align: center; color: #12303A; }
        [data-composition-id="shot-02"] .title { margin: 0; font-size: 120px; line-height: 1.05; font-weight: 800; }
        [data-composition-id="shot-02"] .body { margin: 0; font-size: 52px; line-height: 1.25; }
        [data-composition-id="shot-02"] .accent { color: #1F7A8C; font-weight: 700; }
        [data-composition-id="shot-02"] .picture-zone { position: absolute; left: 0; right: 0; top: 600px; height: 730px; overflow: hidden; }
        [data-composition-id="shot-02"] .diorama { position: absolute; inset: 0; }
      </style>
      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="shot-02"]');
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          // the picture builds up in one continuous growth: items rise one after another, nothing swaps
          SorotKitRuntime.mount("iso", root.querySelector(".diorama"), {
            items: [
              { kind: "tile", x: 0, z: 0, size: 4, height: 0.15, color: "#D7E6EA" },
              { kind: "cylinder", x: -0.6, z: 0.2, size: 1.4, height: 2.6, color: "#1F7A8C" },
              { kind: "block", x: 1.2, z: -0.6, size: 0.9, height: 1.2, color: "#F2B134" },
              { kind: "tree", x: 1.4, z: 1.2, size: 0.8, height: 1.6, color: "#5E9E6E" }
            ],
            floor: "none", camera: "static", zoom: 1.5, grow: "rise", stagger: 0.25, y: 0.5
          }, { tl: tl, start: 0.2, duration: 3.4 });
          // one camera move inside the picture zone (it clips), flat: the diorama is already isometric
          SorotKitRuntime.mount("camera", root.querySelector(".picture-zone"), {
            move: "zoom-in", amount: 0.12, projection: "flat", ease: "travel", target: ".diorama"
          }, { tl: tl, start: 0, duration: 4 });
          // words arrive while the picture builds; the title is fully shown on the first frame
          SorotKitRuntime.mount("text-reveal", root, { target: ".body", by: "word", style: "rise", at: 0.6, stagger: 0.08, length: 0.5 }, { tl: tl, start: 0, duration: 4 });
          tl.fromTo(root.querySelector(".title"), { y: 0, scale: 1 }, { y: -8, scale: 1.02, duration: 4, ease: "none" }, 0);
          window.__timelines["shot-02"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
