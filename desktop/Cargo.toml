[workspace]
members = [".", "core"]
resolver = "3"

[package]
name = "sorot-desktop"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[package.metadata.packager]
product-name = "Sorot"
identifier = "io.github.raufimusaddiq.sorot"
description = "YouTube and local video to 9:16 clips with subtitles"
authors = ["Raufi Musaddiq"]
license-file = "../LICENSE"
formats = ["nsis", "app", "dmg", "appimage", "deb"]
out-dir = "target/packager"
binaries-dir = "target/release"
binaries = [{ path = "sorot-desktop", main = true }]
icons = ["assets/icon/icon.icns", "assets/icon/icon.ico", "assets/icon/icon-512.png"]
# release-desktop.yml puts the compiled engine, ai-pipeline/, generator/ and uv into resources/ first.
resources = ["resources/sorot-engine*", "resources/ai-pipeline", "resources/generator", "resources/uv*"]

# "Open with": CFBundleDocumentTypes on macOS, file associations on Windows, MimeType on Linux.
[[package.metadata.packager.file-associations]]
extensions = ["mp4", "m4v", "mov", "mkv", "webm", "avi"]
mime-type = "video/*"
name = "Video"
role = "viewer"

[package.metadata.packager.nsis]
installer-icon = "assets/icon/icon.ico"
install-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "12.0"

[package.metadata.packager.deb]
desktop-template = "packaging/sorot.desktop"

[package.metadata.packager.appimage]
# AppImage builds its desktop entry from the same template as the deb.

[[test]]
name = "suite"
path = "tests/suite.rs"

[features]
# Agent tooling (--snap, --tree, --script) in release builds too; debug builds always have it.
# Release installers build without it.
headless = ["rune/tooling"]

[dependencies]
sorot-desktop-core = { path = "core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
wgpu = { version = "~30.0.1", default-features = false }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
ureq = { version = "3", default-features = false }
getrandom = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
minisign-verify = "0.2"
base64 = "0.22"
cargo-packager-updater = { version = "0.2", default-features = false, features = ["rustls-tls"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# A dependency's [patch] does not apply here, so each crate Rune patches is patched again
# (same rev as the dependencies above; see RUNE.md).
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }

[build-dependencies]
sorot-desktop-core = { path = "core" }

[dev-dependencies]
tiny_http = "0.12.0"
png = "0.18"

[target."cfg(target_os = \"linux\")".dependencies]
cpal = "0.15"
notify-rust = "4"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
raw-window-handle = "0.6"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSObject"] }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "73b7dec296e6c1284ebdf8af53f544444611c0ae" }

# Debuginfo is what made each test exe carry a ~490 MB PDB: line tables only for our code (panics
# keep file:line, llvm-cov keeps per-line counts), none for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
