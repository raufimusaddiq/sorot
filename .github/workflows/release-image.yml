# Builds and publishes the app images to ghcr.io/raufimusaddiq/sorot, which
# docker-compose.yml and the installers pull. Not run on pushes or PRs (CI only
# tests those) to save runner time: it runs when a GitHub release is
# published, or by hand (Actions → Release image → Run workflow).
# Two variants of backend/Dockerfile: CPU (plain Ubuntu, small) and CUDA (NVIDIA GPU).
#   release v1.2.3  → :1.2.3, :1.2, :latest, :sha-<short>   | same with -cuda
#   manual run      → :sha-<short> (+ :latest if "latest" is ticked)  | same with -cuda
# A pre-release gets its version tags but doesn't move :latest.
name: Release image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      latest:
        description: Also tag as latest / latest-cuda (what installs pull)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  image:
    name: Docker image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            base: ubuntu:22.04
            suffix: ""
          - variant: cuda
            base: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
            suffix: -cuda
    steps:
      # The CUDA variant is several GB while building; drop the runner's
      # preinstalled SDKs to leave room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || inputs.latest == true }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Sorot (${{ matrix.variant }})
            org.opencontainers.image.description=Long videos to 9:16 clips with word-timed captions (API + UI + media pipeline)
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ matrix.base }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry, one per variant: the base and pip layers rarely change.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant }},mode=max
