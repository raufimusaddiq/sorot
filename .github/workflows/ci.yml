# Tests every push and PR; on master (and v* tags) also publishes the app image
# to ghcr.io/raufimusaddiq/sorot, which docker-compose.yml and the installers pull.
# Two variants of backend/Dockerfile: CPU (plain Ubuntu, small) and CUDA (NVIDIA GPU).
#   master  → :latest, :sha-<short>             | :latest-cuda, :sha-<short>-cuda
#   v1.2.3  → :1.2.3, :1.2, :sha-<short>        | :1.2.3-cuda, :1.2-cuda, …
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.12   # same as backend/Dockerfile and scripts/install.sh

jobs:
  bun:
    name: Backend + CLI + UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Backend tests
        working-directory: backend
        run: bun test --coverage
      - name: CLI tests
        working-directory: cli
        run: bun test --coverage
      - name: UI tests
        working-directory: frontend
        run: bun run test
      - name: UI static export
        run: bun run build

  python:
    name: Media pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # Ubuntu 22.04's, as in the image
          cache: pip
          cache-dependency-path: ai-pipeline/requirements.txt
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pip install -r ai-pipeline/requirements.txt
      - name: pytest
        working-directory: ai-pipeline
        run: python -m pytest tests -q

  image:
    name: Docker image (${{ matrix.variant }})
    needs: [bun, python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            base: ubuntu:22.04
            suffix: ""
          - variant: cuda
            base: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
            suffix: -cuda
    steps:
      # The CUDA variant is several GB while building; drop the runner's
      # preinstalled SDKs to leave room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Sorot (${{ matrix.variant }})
            org.opencontainers.image.description=Long videos to 9:16 clips with word-timed captions (API + UI + media pipeline)
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ matrix.base }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry, one per variant: the base / pip / model layers rarely change.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}:buildcache-{1},mode=max', github.repository, matrix.variant) || '' }}
