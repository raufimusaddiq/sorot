# Tests on every push and PR. The Docker images are built and published
# separately, on releases or on demand: see release-image.yml.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.12   # same as backend/Dockerfile and scripts/install.sh

jobs:
  bun:
    name: Backend + CLI + UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Backend tests
        working-directory: backend
        run: bun test --coverage
      - name: CLI tests
        working-directory: cli
        run: bun test --coverage
      - name: UI tests
        working-directory: frontend
        run: bun run test
      - name: UI static export
        run: bun run build

  python:
    name: Media pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # Ubuntu 22.04's, as in the image
          cache: pip
          cache-dependency-path: ai-pipeline/requirements.txt
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pip install -r ai-pipeline/requirements.txt
      - name: pytest
        working-directory: ai-pipeline
        run: python -m pytest tests -q
